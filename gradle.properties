# Shared production host: small heap, two CPUs, no long-lived daemons.
org.gradle.jvmargs=-Xmx2g -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
# Compile Kotlin inside the Gradle process instead of spawning a Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
